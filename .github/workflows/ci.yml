name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes anything: it builds and it tests. The organisation's default hands
# every run a token that can write to the repository, which this does not need and should
# not carry. Stated in the file so it holds wherever the repository ends up.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # No `lfs: true` on purpose. The reference PDFs and comparison fonts are in LFS,
      # and nothing the build or the tests touch is — verified by running the suite on a
      # checkout with LFS skipped. Fetching them here would spend the free LFS bandwidth
      # on every routine build.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The geometry tests render PDFs and read them back, which needs pdftocairo,
      # pdftotext and pdftoppm. Without poppler most of the suite cannot run at all.
      - name: Install poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          # Recorded because the SVG header pdftocairo writes varies between versions,
          # and reading the page size out of it has broken on that before.
          pdftocairo -v 2>&1 | head -1

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The unit suite never opens the app, and every user-visible breakage this project
      # has had was invisible to it. These run against the built site under the headers
      # it ships with, so a content security policy that blocks the pdf.js worker fails
      # here rather than in front of someone.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Test in a browser
        run: npm run test:e2e
