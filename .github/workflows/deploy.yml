name: Deploy

# Tags of the form x.y.z, as agreed — no leading "v".
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

# Checking out is all the repository token is for; Cloudflare is reached with its own
# credentials, and the release is published by hand afterwards.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ips.tr1ckyf0x.dev
    steps:
      # As in CI: LFS is not fetched, because nothing the build needs lives there.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          # Recorded because the SVG header pdftocairo writes varies between versions,
          # and reading the page size out of it has broken on that before.
          pdftocairo -v 2>&1 | head -1

      - run: npm ci

      # A release tag that disagrees with package.json means one of the two was
      # forgotten; better to stop here than to ship a build labelled with the wrong
      # version.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      - name: Typecheck
        run: npx tsc -b

      # The full suite runs again here rather than trusting the tagged commit's CI:
      # a tag can be moved, and this is the build that reaches people.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Everything about the deployment lives in wrangler.toml — the assets directory,
      # the custom domain, the project name — so this step carries no arguments that
      # could drift away from it.
      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
